name: Migrate Essential Snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message == 'Run Essential migration'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Essential source branch
        uses: actions/checkout@v4
        with:
          repository: Arrjack8847/100th-day-donation-invitation
          ref: essential-mobile
          path: source-essential

      - name: Replace destination with Essential snapshot
        shell: bash
        run: |
          rm -rf source-essential/.git

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'source-essential' \
            -exec rm -rf {} +

          cp -a source-essential/. .
          rm -rf source-essential

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Migrate Essential version from essential-mobile"
          git push origin main
