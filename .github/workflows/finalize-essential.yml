name: Finalize Essential Refinement

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Finalize Essential refinement'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rename Essential package
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
          p.name = "100th-day-donation-essential";
          fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          NODE

      - name: Remove inherited Signature opening files
        shell: bash
        run: |
          rm -rf components/opening

          if [ -d public/opening ]; then
            find public/opening -maxdepth 1 -type f \
              ! -name '100-mask-one.svg' \
              ! -name '100-mask-zero-left.svg' \
              ! -name '100-mask-zero-right.svg' \
              -delete
          fi

          rm -f "public/mu-hehehehe-cat-memes-hehe-shorts_v8KezVEr.mp3"
          rm -f "mu-hehehehe-cat-memes-hehe-shorts_v8KezVEr.mp3"
          find . -maxdepth 1 -type f -iname '*HEHEHE*.mp3' -delete
          find . -maxdepth 1 -type f -name 'Bubbles_transition*' -delete
          find . -maxdepth 1 -type f -name 'Soap_bubbles*' -delete

      - name: Install Analytics
        run: npm install @vercel/analytics@latest --save

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/finalize-essential.yml

      - name: Commit verified refinement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Essential mobile-first refinement"
          git push origin main
